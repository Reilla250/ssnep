<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database | ssneps.org</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0f172a;--sidebar:#1e293b;--blue:#1565C0;--green:#16a34a;
      --orange:#d97706;--red:#dc2626;--purple:#7c3aed;
      --text:#e2e8f0;--text-dim:#94a3b8;--border:#334155;
      --card:#1e293b;--card2:#243044;
    }
    html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
    .layout{display:flex;height:100vh;overflow:hidden;}

    /* SIDEBAR */
    .db-sidebar{
      width:220px;background:var(--sidebar);border-right:1px solid var(--border);
      display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
    }
    .db-brand{
      padding:18px 16px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:10px;
    }
    .db-brand .ico{
      width:36px;height:36px;background:var(--blue);border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:800;color:white;flex-shrink:0;
    }
    .db-brand h2{font-size:13px;font-weight:700;line-height:1.2;}
    .db-brand p{font-size:10px;color:var(--text-dim);}
    .db-nav{padding:10px 0;flex:1;}
    .db-nav-label{padding:12px 16px 4px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
    .db-nav-item{
      display:flex;align-items:center;gap:10px;padding:9px 16px;
      font-size:12.5px;font-weight:500;color:var(--text-dim);
      cursor:pointer;border:none;background:none;width:100%;text-align:left;
      transition:background .15s,color .15s;border-radius:0;
    }
    .db-nav-item i{width:14px;text-align:center;font-size:12px;}
    .db-nav-item .count{
      margin-left:auto;background:var(--border);color:var(--text-dim);
      font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;
    }
    .db-nav-item:hover{background:#2d3f55;color:var(--text);}
    .db-nav-item.active{background:var(--blue);color:white;}
    .db-nav-item.active .count{background:rgba(255,255,255,0.2);color:white;}
    .db-footer{padding:12px 16px;border-top:1px solid var(--border);}
    .db-footer a{
      display:flex;align-items:center;gap:8px;padding:8px 12px;
      background:rgba(255,255,255,0.05);border-radius:8px;
      font-size:12px;color:var(--text-dim);text-decoration:none;
      transition:background .2s;
    }
    .db-footer a:hover{background:rgba(255,255,255,0.1);color:white;}

    /* MAIN */
    .db-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .db-topbar{
      height:54px;background:var(--sidebar);border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;flex-shrink:0;
    }
    .db-topbar-left{display:flex;align-items:center;gap:12px;}
    .db-topbar-left h1{font-size:15px;font-weight:700;}
    .db-topbar-left .table-badge{
      background:var(--blue);color:white;font-size:10px;font-weight:700;
      padding:2px 9px;border-radius:20px;
    }
    .db-topbar-right{display:flex;align-items:center;gap:8px;}
    .db-btn{
      padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;
      border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:all .2s;font-family:'Inter',sans-serif;
    }
    .db-btn-blue{background:var(--blue);color:white;}
    .db-btn-blue:hover{background:#0D47A1;}
    .db-btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
    .db-btn-outline:hover{background:var(--card2);color:white;}
    .db-btn-red{background:var(--red);color:white;}
    .db-btn-red:hover{background:#b91c1c;}

    /* CONTENT */
    .db-content{flex:1;overflow:auto;padding:20px;}

    /* OVERVIEW STATS */
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px;}
    .stat-box{
      background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:16px;cursor:pointer;transition:border-color .2s,transform .2s;
    }
    .stat-box:hover{border-color:var(--blue);transform:translateY(-2px);}
    .stat-box.active{border-color:var(--blue);background:rgba(21,101,192,0.1);}
    .stat-box .sb-icon{font-size:20px;margin-bottom:8px;}
    .stat-box .sb-val{font-size:24px;font-weight:800;margin-bottom:2px;}
    .stat-box .sb-label{font-size:11px;color:var(--text-dim);font-weight:500;}

    /* TABLE PANEL */
    .table-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
    .table-toolbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;
    }
    .table-toolbar .tt-left{display:flex;align-items:center;gap:10px;}
    .search-wrap{position:relative;}
    .search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:12px;}
    .search-wrap input{
      background:var(--bg);border:1px solid var(--border);border-radius:6px;
      padding:7px 10px 7px 30px;font-size:12px;color:var(--text);outline:none;width:200px;
      transition:border-color .2s;font-family:'Inter',sans-serif;
    }
    .search-wrap input:focus{border-color:var(--blue);}
    .search-wrap input::placeholder{color:var(--text-dim);}

    .data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
    .data-table thead th{
      background:#162032;padding:10px 14px;font-size:10px;font-weight:700;
      letter-spacing:.7px;color:var(--text-dim);text-transform:uppercase;
      text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;
    }
    .data-table tbody tr{border-bottom:1px solid #1e2d3d;transition:background .12s;}
    .data-table tbody tr:last-child{border-bottom:none;}
    .data-table tbody tr:hover{background:#243044;}
    .data-table td{padding:11px 14px;vertical-align:middle;}
    .data-table td .cell-id{
      font-family:'JetBrains Mono',monospace;font-size:11px;
      color:var(--text-dim);background:#162032;padding:2px 7px;border-radius:4px;
    }
    .data-table td .cell-name{font-weight:600;color:var(--text);}
    .data-table td .cell-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
    .data-table td .cell-text{color:var(--text-dim);font-size:11.5px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;}
    .badge-green{background:rgba(22,163,74,.2);color:#4ade80;border:1px solid rgba(22,163,74,.3);}
    .badge-orange{background:rgba(217,119,6,.2);color:#fbbf24;border:1px solid rgba(217,119,6,.3);}
    .badge-blue{background:rgba(21,101,192,.3);color:#60a5fa;border:1px solid rgba(21,101,192,.4);}
    .badge-red{background:rgba(220,38,38,.2);color:#f87171;border:1px solid rgba(220,38,38,.3);}
    .badge-gray{background:rgba(148,163,184,.1);color:var(--text-dim);border:1px solid var(--border);}
    .badge-purple{background:rgba(124,58,237,.2);color:#a78bfa;border:1px solid rgba(124,58,237,.3);}

    .avatar-cell{
      width:28px;height:28px;border-radius:50%;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:700;color:white;flex-shrink:0;margin-right:8px;
    }

    /* JSON RAW VIEWER */
    .json-viewer{
      font-family:'JetBrains Mono',monospace;font-size:11.5px;
      background:#080f1a;border:1px solid var(--border);border-radius:10px;
      padding:20px;overflow:auto;max-height:500px;line-height:1.7;
      color:#a8d8a8;white-space:pre-wrap;word-break:break-all;
    }
    .json-key{color:#79c0ff;}
    .json-str{color:#a8d8a8;}
    .json-num{color:#f8c555;}
    .json-bool{color:#ff7b72;}
    .json-null{color:#8b949e;}

    /* SETTINGS TABLE */
    .settings-kv{width:100%;border-collapse:collapse;}
    .settings-kv tr{border-bottom:1px solid var(--border);}
    .settings-kv tr:hover{background:#243044;}
    .settings-kv td{padding:10px 16px;font-size:12.5px;vertical-align:top;}
    .settings-kv td:first-child{
      font-family:'JetBrains Mono',monospace;font-size:11px;
      color:#79c0ff;font-weight:600;width:220px;white-space:nowrap;
    }
    .settings-kv td:last-child{color:var(--text-dim);word-break:break-all;}
    .settings-kv td:last-child.val-bool-true{color:#4ade80;}
    .settings-kv td:last-child.val-bool-false{color:#f87171;}

    .empty-state{
      text-align:center;padding:50px 20px;color:var(--text-dim);
    }
    .empty-state i{font-size:36px;display:block;margin-bottom:12px;opacity:.4;}
    .empty-state p{font-size:13px;}

    /* REFRESH INDICATOR */
    .refresh-indicator{
      display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);
    }
    .live-dot{
      width:7px;height:7px;border-radius:50%;background:#16a34a;
      animation:pulse 2s infinite;
    }
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

    .tab-pills{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
    .tab-pill{
      padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;
      border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;
      transition:all .2s;
    }
    .tab-pill.active{background:var(--blue);border-color:var(--blue);color:white;}
    .tab-pill:hover:not(.active){background:var(--card2);color:white;}

    .section-view{display:none;}
    .section-view.active{display:block;}

    .storage-bar{
      background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:16px 20px;margin-bottom:20px;
      display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    }
    .storage-bar .sb-info{font-size:12px;color:var(--text-dim);}
    .storage-bar .sb-info strong{color:var(--text);font-size:14px;}
    .storage-track{flex:1;min-width:180px;height:6px;background:var(--border);border-radius:3px;}
    .storage-fill{height:100%;background:linear-gradient(90deg,var(--blue),#1976D2);border-radius:3px;}
  </style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="db-sidebar">
    <div class="db-brand">
      <div class="ico">🗄</div>
      <div><h2>SSNeP+ DB</h2><p>LocalStorage Viewer</p></div>
    </div>
    <nav class="db-nav">
      <div class="db-nav-label">Tables</div>
      <button class="db-nav-item active" data-table="overview" onclick="showTable('overview')">
        <i class="fas fa-th"></i>Overview<span class="count" id="cnt-overview">—</span>
      </button>
      <button class="db-nav-item" data-table="settings" onclick="showTable('settings')">
        <i class="fas fa-cog"></i>settings<span class="count" id="cnt-settings">1</span>
      </button>
      <button class="db-nav-item" data-table="team" onclick="showTable('team')">
        <i class="fas fa-users"></i>team<span class="count" id="cnt-team">0</span>
      </button>
      <button class="db-nav-item" data-table="news" onclick="showTable('news')">
        <i class="fas fa-newspaper"></i>news<span class="count" id="cnt-news">0</span>
      </button>
      <button class="db-nav-item" data-table="programs" onclick="showTable('programs')">
        <i class="fas fa-hand-holding-medical"></i>programs<span class="count" id="cnt-programs">0</span>
      </button>
      <button class="db-nav-item" data-table="portfolio" onclick="showTable('portfolio')">
        <i class="fas fa-images"></i>portfolio<span class="count" id="cnt-portfolio">0</span>
      </button>
      <button class="db-nav-item" data-table="messages" onclick="showTable('messages')">
        <i class="fas fa-envelope"></i>messages<span class="count" id="cnt-messages">0</span>
      </button>
      <button class="db-nav-item" data-table="subscribers" onclick="showTable('subscribers')">
        <i class="fas fa-bell"></i>subscribers<span class="count" id="cnt-subscribers">0</span>
      </button>
      <button class="db-nav-item" data-table="pages" onclick="showTable('pages')">
        <i class="fas fa-file-alt"></i>pages<span class="count" id="cnt-pages">0</span>
      </button>
      <button class="db-nav-item" data-table="navLinks" onclick="showTable('navLinks')">
        <i class="fas fa-bars"></i>navLinks<span class="count" id="cnt-navLinks">0</span>
      </button>
      <button class="db-nav-item" data-table="activity" onclick="showTable('activity')">
        <i class="fas fa-history"></i>activity<span class="count" id="cnt-activity">0</span>
      </button>
      <div class="db-nav-label" style="margin-top:8px;">Actions</div>
      <button class="db-nav-item" onclick="exportAllJSON()">
        <i class="fas fa-download"></i>Export All (JSON)
      </button>
      <button class="db-nav-item" onclick="if(confirm('Clear ALL data?')){clearAll();}">
        <i class="fas fa-trash"></i>Clear All Data
      </button>
    </nav>
    <div class="db-footer">
      <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Admin</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="db-main">
    <div class="db-topbar">
      <div class="db-topbar-left">
        <h1 id="currentTableTitle">Database Overview</h1>
        <span class="table-badge" id="currentTableBadge">ssnep_*</span>
      </div>
      <div class="db-topbar-right">
        <div class="refresh-indicator">
          <div class="live-dot"></div>
          <span>Auto-refresh 3s</span>
        </div>
        <button class="db-btn db-btn-outline" onclick="loadAll()"><i class="fas fa-sync"></i> Refresh</button>
        <button class="db-btn db-btn-blue" onclick="exportAllJSON()"><i class="fas fa-download"></i> Export</button>
      </div>
    </div>

    <div class="db-content" id="dbContent">
      <!-- Rendered dynamically -->
    </div>
  </div>

</div>

<script>
const TABLES = ['settings','team','news','programs','portfolio','messages','subscribers','pages','navLinks','activity'];
let currentTable = 'overview';
let searchQuery = '';
let viewMode = 'table'; // 'table' | 'json'

function get(key) {
  try { const v = localStorage.getItem('ssnep_'+key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}

function count(key) {
  const d = get(key);
  return Array.isArray(d) ? d.length : (d ? 1 : 0);
}

function loadAll() {
  TABLES.forEach(t => {
    const el = document.getElementById('cnt-'+t);
    if (el) el.textContent = count(t);
  });
  const total = TABLES.reduce((s,t)=>s+count(t),0);
  const el = document.getElementById('cnt-overview');
  if (el) el.textContent = total;
  renderCurrentTable();
}

function showTable(name) {
  currentTable = name;
  searchQuery = '';
  document.querySelectorAll('.db-nav-item[data-table]').forEach(b=>b.classList.remove('active'));
  const active = document.querySelector(`[data-table="${name}"]`);
  if (active) active.classList.add('active');
  const titles = {
    overview:'Database Overview', settings:'settings', team:'team',
    news:'news', programs:'programs', portfolio:'portfolio',
    messages:'messages', subscribers:'subscribers', pages:'pages',
    navLinks:'navLinks', activity:'activity'
  };
  document.getElementById('currentTableTitle').textContent = titles[name]||name;
  document.getElementById('currentTableBadge').textContent = name==='overview'?'ssnep_*':'ssnep_'+name;
  renderCurrentTable();
}

function renderCurrentTable() {
  const c = document.getElementById('dbContent');
  if (currentTable === 'overview') { c.innerHTML = renderOverview(); return; }
  if (currentTable === 'settings') { c.innerHTML = renderSettings(); return; }
  const data = get(currentTable);
  if (!Array.isArray(data) || !data.length) {
    c.innerHTML = `<div class="empty-state"><i class="fas fa-database"></i><p>No records in <strong>${currentTable}</strong> yet.</p></div>`;
    return;
  }
  const renders = {
    team: renderTeamTable, news: renderNewsTable, programs: renderProgramsTable,
    portfolio: renderPortfolioTable, messages: renderMessagesTable,
    subscribers: renderSubscribersTable, pages: renderPagesTable,
    navLinks: renderNavTable, activity: renderActivityTable,
  };
  c.innerHTML = (renders[currentTable]||renderGenericTable)(data);
}

// ---- OVERVIEW ----
function renderOverview() {
  const sizes = TABLES.map(t=>{
    const raw = localStorage.getItem('ssnep_'+t)||'';
    return {key:t, size:raw.length, count:count(t)};
  });
  const totalBytes = sizes.reduce((s,x)=>s+x.size,0);
  const totalRecords = sizes.reduce((s,x)=>s+x.count,0);
  const maxSize = Math.max(...sizes.map(x=>x.size),1);
  const icons = {settings:'⚙️',team:'👥',news:'📰',programs:'🩺',portfolio:'🖼️',messages:'✉️',subscribers:'🔔',pages:'📄',navLinks:'🔗',activity:'📋'};
  const colors = ['#1565C0','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#92400e','#1565C0','#374151'];

  let statsHtml = sizes.map((s,i)=>`
    <div class="stat-box ${currentTable===s.key?'active':''}" onclick="showTable('${s.key}')">
      <div class="sb-icon">${icons[s.key]||'📦'}</div>
      <div class="sb-val" style="color:${colors[i]}">${s.count}</div>
      <div class="sb-label">${s.key}</div>
    </div>
  `).join('');

  let tableHtml = `
    <table class="data-table">
      <thead><tr><th>Table</th><th>Records</th><th>Size (bytes)</th><th>Storage Used</th><th>Status</th></tr></thead>
      <tbody>
        ${sizes.map((s,i)=>`
          <tr onclick="showTable('${s.key}')" style="cursor:pointer;">
            <td>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:16px;">${icons[s.key]||'📦'}</span>
                <div>
                  <div class="cell-name" style="font-family:'JetBrains Mono',monospace;font-size:12px;">ssnep_${s.key}</div>
                  <div class="cell-sub">${s.key}</div>
                </div>
              </div>
            </td>
            <td><span style="font-size:18px;font-weight:800;color:${colors[i]}">${s.count}</span></td>
            <td><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#94a3b8;">${s.size.toLocaleString()}</span></td>
            <td style="min-width:140px;">
              <div style="background:#1e293b;border-radius:3px;height:6px;overflow:hidden;">
                <div style="width:${Math.round(s.size/maxSize*100)}%;height:100%;background:${colors[i]};border-radius:3px;"></div>
              </div>
            </td>
            <td><span class="badge ${s.count>0?'badge-green':'badge-gray'}">${s.count>0?'Has Data':'Empty'}</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  return `
    <div class="storage-bar">
      <div class="sb-info">Total Records: <strong>${totalRecords}</strong></div>
      <div class="sb-info">Total Storage: <strong>${(totalBytes/1024).toFixed(1)} KB</strong></div>
      <div class="storage-track" style="min-width:200px;">
        <div class="storage-fill" style="width:${Math.min(100,totalBytes/5120*100).toFixed(0)}%;"></div>
      </div>
      <div class="sb-info" style="font-size:10px;">${(totalBytes/1024).toFixed(1)} / 5,000 KB used</div>
    </div>
    <div class="stats-row">${statsHtml}</div>
    <div class="table-panel">${tableHtml}</div>
  `;
}

// ---- SETTINGS ----
function renderSettings() {
  const s = get('settings');
  if (!s) return `<div class="empty-state"><i class="fas fa-cog"></i><p>No settings stored yet. Log in to the admin panel first.</p></div>`;
  const rows = Object.entries(s).map(([k,v])=>{
    let cls = ''; let disp = String(v);
    if (typeof v === 'boolean') { cls = v?'val-bool-true':'val-bool-false'; disp = String(v); }
    else if (k.toLowerCase().includes('pass')) disp = '••••••••••';
    return `<tr><td>${esc(k)}</td><td class="${cls}">${esc(disp)}</td></tr>`;
  }).join('');
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:700;">Settings Record <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#94a3b8;margin-left:8px;">ssnep_settings</span></h2>
      <button class="db-btn db-btn-outline" onclick="toggleRaw('settings')"><i class="fas fa-code"></i> Raw JSON</button>
    </div>
    <div class="table-panel" id="view-settings-table">
      <table class="settings-kv"><thead><tr><th style="padding:10px 16px;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);background:#162032;">Key</th><th style="padding:10px 16px;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);background:#162032;">Value</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div style="display:none;margin-top:16px;" id="view-settings-raw">
      <div class="json-viewer">${syntaxHighlight(JSON.stringify(s,null,2))}</div>
    </div>
  `;
}

// ---- TEAM ----
function renderTeamTable(data) {

// ---- GENERIC ----
function renderGenericTable(data) {
  if (!data.length) return `<div class="empty-state"><i class="fas fa-table"></i><p>Empty table.</p></div>`;
  const keys = Object.keys(data[0]);
  return wrapTable(`
    <table class="data-table">
      <thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead>
      <tbody>${data.map(row=>`
        <tr>${keys.map(k=>`<td><div class="cell-text">${esc(String(row[k]??'—').substring(0,80))}</div></td>`).join('')}</tr>
      `).join('')}</tbody>
    </table>
  `);
}

function wrapTable(html) {
  return `<div class="table-panel">${html}</div>`;
}

function searchBox(table) {
  return `<div class="search-wrap"><i class="fas fa-search"></i><input type="text" placeholder="Search…" value="${esc(searchQuery)}" oninput="searchQuery=this.value.toLowerCase();renderCurrentTable();" /></div>`;
}

function showRaw(key) {
  const d = get(key);
  document.getElementById('dbContent').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <h3 style="font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;">ssnep_${key}</h3>
      <button class="db-btn db-btn-outline" onclick="showTable('${key}')"><i class="fas fa-table"></i> Table View</button>
    </div>
    <div class="json-viewer">${syntaxHighlight(JSON.stringify(d,null,2))}</div>
  `;
}

function toggleRaw(key) {
  const tv = document.getElementById('view-'+key+'-table');
  const rv = document.getElementById('view-'+key+'-raw');
  if (tv && rv) {
    const isRaw = rv.style.display !== 'none';
    tv.style.display = isRaw ? '' : 'none';
    rv.style.display = isRaw ? 'none' : '';
  }
}

function syntaxHighlight(json) {
  return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
      let cls = 'json-num';
      if (/^"/.test(match)) { cls = /:$/.test(match) ? 'json-key' : 'json-str'; }
      else if (/true|false/.test(match)) cls = 'json-bool';
      else if (/null/.test(match)) cls = 'json-null';
      return `<span class="${cls}">${match}</span>`;
    });
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportAllJSON() {
  const data = {};
  TABLES.forEach(t => { data[t] = get(t); });
  const json = JSON.stringify({version:'1.0',exported:new Date().toISOString(),data},null,2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download = `ssnep_db_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function clearAll() {
  TABLES.forEach(t => localStorage.removeItem('ssnep_'+t));
  loadAll();
  alert('All data cleared.');
}

// Auto-refresh every 3 seconds
setInterval(loadAll, 3000);
loadAll();
